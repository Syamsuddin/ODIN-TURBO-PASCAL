#
# Expected outputs of the Pascal corpus made by Free Pascal on another OS
# (scripts/oracle.py --os). It runs when this file changes on a work branch
# (edit NAMES to regenerate other programs); the files come back as an
# artifact to review and commit.
name: Oracle

on:
  push:
    branches: ["platform/**"]
    paths: [".github/workflows/oracle.yml"]

env:
  # Programs whose behaviour rightly differs on Windows: DOS attributes and
  # paths, Exec, and text files with CR LF line ends.
  NAMES: DOS_FIND DOS_FSPLIT DOS_PATHS DOS_EXEC FIL_SEEKEOF FIL_TXTREAD

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Free Pascal
        run: |
          choco install freepascal -y --no-progress
          echo "C:/tools/freepascal/bin/i386-win32" >> "$GITHUB_PATH"
      - name: Oracle
        run: python scripts/oracle.py --fpc fpc --os windows $NAMES
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-windows
          path: |
            tests/pascal/**/*.windows.out
            tests/pascal/**/*.windows.code
